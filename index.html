<!DOCTYPE html>
<html lang="en">
<head>
    <!-- character set (supports all languages) -->
    <meta charset="UTF-8">
    <!-- makes page work on phones/tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- shows on browser tab -->
    <title>Staff Locator</title>
    <!-- Link to external CSS file for styling -->
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- Main container - wraps everything -->
    <div class="app-shell">

        <!-- HEADER - top bar -->
        <div class="header">

            <!-- Left: clock and date -->
            <div class="header-left">
                <div class="header-clock">
                    <span class="clock" id="liveClock">--:--:--</span>
                    <span class="date" id="dayDateDisplay"></span>
                </div>
            </div>

            <!-- Center: page title and school name -->
            <div class="header-center">
                <h1>Staff Locator</h1>
                <p class="header-sub">Saint Kentigern College</p>
            </div>

            <!-- Right: status badges and login button -->
            <div class="header-right">
                <span class="pill pill-neutral" id="headerDayBadge">Day –</span>
                <span class="pill pill-neutral" id="headerStatusBadge">—</span>
                <button class="login-btn" id="loginBtn">Login</button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="page-content">
            <div class="dashboard">

                <!-- LEFT PANEL: teacher list -->
                <div class="teacher-panel">
                    <div class="panel-title">Teachers</div>
                    <!-- Search box -->
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search...">
                        <button class="clear" id="clearSearchBtn">×</button>
                    </div>
                    <!-- List of teachers -->
                    <div class="teacher-list" id="teacherListContainer">
                        <div class="loading">Loading teachers...</div>
                    </div>
                </div>

                <!-- RIGHT PANEL: timetable for selected teacher -->
                <div class="timetable-panel" id="dropZonePanel">
                    <!-- Header with teacher name and clear button -->
                    <div class="timetable-header">
                        <div class="selected" id="selectedTeacherName">Select a teacher</div>
                        <button class="clear-btn" id="clearListBtn">Clear</button>
                    </div>
                    <!-- Teacher's current status -->
                    <div class="status" id="statusDisplay"></div>
                    <!-- Timetable view -->
                    <div class="timetable-list" id="timetableView">
                        <div class="drop-msg">
                            <div class="main">Click or drag a teacher to view location</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <footer>Staff Locator</footer>
        </div>
    </div>

    <!-- Link to external JavaScript file for interactivity -->
    <script src="index.js"></script>
</body>
</html>
