<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class = "login-card">
        <div class = "login-header">
            <h1> Staff Locator</h1>
            <p> Sign in to mark teacher absences</p>
        </div>

        <form id = "loginForm">
            <div class = "form-div">
                <span>Username</span>
                <input type="text" id="username" placeholder="Enter your username">
            </div>

            <div class = "form-div">
                <span>Password:</span>
                <input type="password" id="password" placeholder="Enter your password">
            </div>


            <button type = "submit" id = "signBtn" class="signin-btn"> Sign in</button>
        </form>
    </div>

    <div>
        <footer> <p></p> </footer>
    </div>
    <script src = "login.js"></script>
</body>
</html>
